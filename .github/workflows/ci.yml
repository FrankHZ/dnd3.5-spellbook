name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for PDF extraction tests
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PDF extraction package
        run: python -m pip install ./data-tools/pdf-extract

      - name: Test PDF extraction with synthetic sources
        run: python -m unittest discover -s data-tools/pdf-extract/tests -v

      - name: Test domain-list inventory with synthetic spans
        run: python -m unittest discover -s data-tools/audits -p test_sc_domain_lists.py -v

      - name: Run portable validation
        run: npm run ci:portable
